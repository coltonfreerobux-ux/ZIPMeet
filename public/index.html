<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZIPMEET</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    height:100vh;
    overflow:hidden;
}

.header{
    height:70px;
    background:#1b1b1b;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    padding-left:20px;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#3399ff;
}

.container{
    display:flex;
    height:calc(100vh - 70px);
}

.left{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

.right{
    width:350px;
    background:black;
    border-left:2px solid #222;
    display:flex;
    flex-direction:column;
}

.card{
    background:#1e1e1e;
    border-radius:14px;
    padding:20px;
    margin-bottom:15px;
}

.card h2{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2d2d2d;
    color:white;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-top:8px;
}

#createBtn{
    background:#0b7cff;
    color:white;
}

#joinBtn{
    background:#00a84f;
    color:white;
}

#micBtn{
    background:#ff8800;
    color:white;
}

#muteBtn{
    background:#cc0000;
    color:white;
}

#roomDisplay{
    margin-top:15px;
    font-size:28px;
    font-weight:bold;
    color:#49a8ff;
}

#participants{
    margin-top:10px;
}

.user{
    background:#2b2b2b;
    padding:10px;
    border-radius:8px;
    margin-bottom:5px;
}

#audioContainer audio{
    width:100%;
    margin-top:10px;
}

.transcriptHeader{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #333;
    font-weight:bold;
}

#transcriptBox{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.msg{
    background:#161616;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
}

.status{
    color:#66ff99;
    margin-top:10px;
}

</style>

</head>
<body>

<div class="header">
    <div class="logo">ZIPMEET</div>
</div>

<div class="container">

    <div class="left">

        <div class="card">

            <h2>Your Name</h2>

            <input
            id="username"
            placeholder="Enter your name">

        </div>

        <div class="card">

            <h2>Create Meeting</h2>

            <button id="createBtn">
                Create Room
            </button>

            <div id="roomDisplay"></div>

        </div>

        <div class="card">

            <h2>Join Meeting</h2>

            <input
            id="joinCode"
            placeholder="Enter Room Code">

            <button id="joinBtn">
                Join Room
            </button>

        </div>

        <div class="card">

            <h2>Audio Controls</h2>

            <button id="micBtn">
                Enable Microphone
            </button>

            <button id="muteBtn">
                Mute
            </button>

            <div class="status" id="audioStatus">
                Microphone Not Enabled
            </div>

        </div>

        <div class="card">

            <h2>Participants</h2>

            <div id="participants"></div>

        </div>

        <div class="card">

            <h2>Remote Audio</h2>

            <div id="audioContainer"></div>

        </div>

    </div>

    <div class="right">

        <div class="transcriptHeader">
            LIVE TRANSCRIPT
        </div>

        <div id="transcriptBox"></div>

    </div>

</div>

/socket.io/socket.io.jsscript>

<script>

const socket = io();

let username = "";
let roomCode = "";
let localStream = null;
let muted = false;
let peers = {};

function generateCode()
{
    return Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();
}

function transcript(text)
{
    const div =
    document.createElement("div");

    div.className = "msg";
    div.innerText = text;

    const box =
    document.getElementById(
        "transcriptBox"
    );

    box.appendChild(div);
    box.scrollTop =
    box.scrollHeight;
}

function updateParticipants(users)
{
    const container =
    document.getElementById(
        "participants"
    );

    container.innerHTML = "";

    users.forEach(user =>
    {
        const div =
        document.createElement("div");

        div.className = "user";

        div.innerText =
        user.username || user.socketId;

        container.appendChild(div);
    });
}

document
.getElementById("micBtn")
.addEventListener(
"click",
async () =>
{
    try
    {
        localStream =
        await navigator
        .mediaDevices
        .getUserMedia({
            audio:true
        });

        document
        .getElementById(
            "audioStatus"
        )
        .innerText =
        "Microphone Enabled";

        transcript(
        "Microphone Enabled"
        );

        startSpeechRecognition();
    }
    catch(err)
    {
        alert(
        "Microphone permission denied"
        );
    }
});

document
.getElementById("muteBtn")
.addEventListener(
"click",
() =>
{
    if(!localStream)
    {
        alert(
        "Enable microphone first"
        );
        return;
    }

    muted = !muted;

    localStream
    .getAudioTracks()
    .forEach(track =>
    {
        track.enabled = !muted;
    });

    document
    .getElementById(
        "muteBtn"
    )
    .innerText =
    muted ? "Unmute" : "Mute";
});

document
.getElementById("createBtn")
.addEventListener(
"click",
() =>
{
    username =
    document
    .getElementById(
        "username"
    )
    .value
    .trim();

    if(!username)
    {
        alert(
        "Enter username"
        );
        return;
    }

    roomCode =
    generateCode();

    document
    .getElementById(
        "roomDisplay"
    )
    .innerText =
    roomCode;

    transcript(
    "Created room " +
    roomCode
    );

    socket.emit(
    "create-room",
    {
        roomCode,
        username
    });
});

document
.getElementById("joinBtn")
.addEventListener(
"click",
() =>
{
    username =
    document
    .getElementById(
        "username"
    )
    .value
    .trim();

    if(!username)
    {
        alert(
        "Enter username"
        );
        return;
    }

    roomCode =
    document
    .getElementById(
        "joinCode"
    )
    .value
    .trim()
    .toUpperCase();

    if(!roomCode)
    {
        alert(
        "Enter room code"
        );
        return;
    }

    document
    .getElementById(
        "roomDisplay"
    )
    .innerText =
    roomCode;

    socket.emit(
    "join-room",
    {
        roomCode,
        username
    });

    transcript(
    "Joined room " +
    roomCode
    );
});

socket.on(
"participant-list",
users =>
{
    updateParticipants(
    users
    );
});

socket.on(
"user-joined",
data =>
{
    transcript(
    "User joined"
    );
});

socket.on(
"user-left",
() =>
{
    transcript(
    "User left"
    );
});

socket.on(
"transcript",
data =>
{
    transcript(
    data.username +
    ": " +
    data.text
    );
});

function startSpeechRecognition()
{
    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition)
    {
        transcript(
        "Speech Recognition Unsupported"
        );
        return;
    }

    const recognition =
    new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult =
    event =>
    {
        const text =
        event.results[
        event.results.length - 1
        ][0].transcript;

        socket.emit(
        "transcript",
        {
            text
        });
    };

    recognition.start();
}

</script>

</body>
</html>
