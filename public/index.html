<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZIPMEET</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{
background:#121212;
color:white;
height:100vh;
overflow:hidden;
}

.header{
height:70px;
background:#1d1d1d;
display:flex;
align-items:center;
padding:0 20px;
gap:10px;
border-bottom:1px solid #333;
}

.logo{
font-size:28px;
font-weight:bold;
color:#4da3ff;
}

.main{
display:flex;
height:calc(100vh - 70px);
}

.left{
flex:1;
padding:20px;
overflow:auto;
}

.right{
width:340px;
background:black;
display:flex;
flex-direction:column;
border-left:2px solid #222;
}

.panel{
background:#1e1e1e;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.create{
background:#0078ff;
color:white;
}

.join{
background:#00aa55;
color:white;
}

.mute{
background:red;
color:white;
}

#roomCode{
font-size:28px;
color:#4da3ff;
margin-top:10px;
}

#participants{
margin-top:10px;
}

.participant{
padding:8px;
background:#292929;
margin-bottom:5px;
border-radius:6px;
}

#audios audio{
display:block;
margin-top:10px;
}

.right h2{
padding:15px;
text-align:center;
background:#000;
}

#transcripts{
flex:1;
overflow:auto;
padding:10px;
}

.transcript{
background:#161616;
padding:10px;
margin-bottom:8px;
border-radius:6px;
}

</style>
</head>
<body>

<div class="header">

<div class="logo">
ZIPMEET
</div>

</div>

<div class="main">

<div class="left">

<div class="panel">

<h2>User Information</h2>

<input
id="username"
placeholder="Your Name"
/>

</div>

<div class="panel">

<h2>Create Meeting</h2>

<button
class="create"
onclick="createRoom()">
Create Room
</button>

<div id="roomCode"></div>

</div>

<div class="panel">

<h2>Join Meeting</h2>

<input
id="joinCode"
placeholder="Meeting Code"
/>

<button
class="join"
onclick="joinRoom()">
Join Room
</button>

</div>

<div class="panel">

<h2>Audio Controls</h2>

<button onclick="enableMic()">
Enable Microphone
</button>

<br>

<button
class="mute"
onclick="toggleMute()">
Mute / Unmute
</button>

</div>

<div class="panel">

<h2>Participants</h2>

<div id="participants"></div>

</div>

<div class="panel">

<h2>Remote Audio</h2>

<div id="audios"></div>

</div>

</div>

<div class="right">

<h2>Live Transcript</h2>

<div id="transcripts"></div>

</div>

</div>

/socket.io/socket.io.jsscript>

<script>

const socket = io();

let roomCode = "";
let username = "";
let localStream = null;
let peers = {};
let micMuted = false;

function randomCode(){
return Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();
}

function createRoom(){

username =
document.getElementById("username")
.value.trim();

if(!username){
alert("Enter a username");
return;
}

roomCode = randomCode();

document.getElementById(
"roomCode"
).innerText = roomCode;

socket.emit(
"create-room",
{
roomCode,
username
}
);

}

function joinRoom(){

username =
document.getElementById("username")
.value.trim();

if(!username){

alert("Enter a username");
return;
}

roomCode =
document.getElementById("joinCode")
.value.trim()
.toUpperCase();

if(!roomCode){
alert("Enter room code");
return;
}

document.getElementById(
"roomCode"
).innerText = roomCode;

socket.emit(
"join-room",
{
roomCode,
username
}
);

}

async function enableMic(){

try{

localStream =
await navigator.mediaDevices
.getUserMedia({
audio:true
});

startSpeechRecognition();

alert("Microphone Enabled");

}catch(err){

alert("Microphone permission denied");

}

}

function toggleMute(){

if(!localStream)
return;

micMuted = !micMuted;

localStream
.getAudioTracks()
.forEach(track=>{
track.enabled = !micMuted;
});

socket.emit(
"mute-state",
{
muted:micMuted
}
);

}

function updateParticipants(users){

const container =
document.getElementById(
"participants"
);

container.innerHTML = "";

users.forEach(user=>{

const div =
document.createElement("div");

div.className =
"participant";

div.innerText =
user.username +
(user.muted ? " 🔇" : " 🎤");

container.appendChild(div);

});

}

socket.on(
"participant-list",
users=>{
updateParticipants(users);
}
);

socket.on(
"user-joined",
async data=>{

if(!localStream)
return;

const peer =
createPeer(data.socketId);

peers[data.socketId] = peer;

localStream.getTracks()
.forEach(track=>{
peer.addTrack(
track,
localStream
);
});

const offer =
await peer.createOffer();

await peer.setLocalDescription(
offer
);

socket.emit(
"offer",
{
target:data.socketId,
offer
}
);

});

socket.on(
"offer",
async data=>{

if(!localStream)
return;

const peer =
createPeer(data.sender);

peers[data.sender] = peer;

localStream.getTracks()
.forEach(track=>{
peer.addTrack(
track,
localStream
);
});

await peer.setRemoteDescription(
new RTCSessionDescription(
data.offer
)
);

const answer =
await peer.createAnswer();

await peer.setLocalDescription(
answer
);

socket.emit(
"answer",
{
target:data.sender,
answer
}
);

});

socket.on(
"answer",
async data=>{

if(peers[data.sender]){

await peers[data.sender]
.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

}

});

socket.on(
"ice-candidate",
async data=>{

if(peers[data.sender]){

await peers[data.sender]
.addIceCandidate(
new RTCIceCandidate(
data.candidate
)
);

}

});

function createPeer(targetId){

const peer =
new RTCPeerConnection({

iceServers:[
{
urls:
"stun:stun.l.google.com:19302"
}
]

});

peer.onicecandidate =
event=>{

if(event.candidate){

socket.emit(
"ice-candidate",
{
target:targetId,
candidate:event.candidate
}
);

}

};

peer.ontrack = e=>{

let audio =
document.getElementById(
"audio-"+targetId
);

if(!audio){

audio =
document.createElement(
"audio"
);

audio.id =
"audio-"+targetId;

audio.autoplay = true;

document
.getElementById(
"audios"
)
.appendChild(audio);

}

audio.srcObject =
e.streams[0];

};

return peer;

}

function addTranscript(text){

const box =
document.getElementById(
"transcripts"
);

const div =
document.createElement(
"div"
);

div.className =
"transcript";

div.innerText =
text;

box.appendChild(div);

box.scrollTop =
box.scrollHeight;

}

socket.on(
"transcript",
data=>{

addTranscript(
data.username +
": " +
data.text
);

});

function startSpeechRecognition(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

console.log(
"Speech recognition unavailable"
);

return;
}

const recognition =
new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = false;

recognition.onresult = event=>{

const text =
event.results[
event.results.length - 1
][0].transcript;

socket.emit(
"transcript",
{
text
}
);

};

recognition.start();

}

</script>

</body>
</html>
